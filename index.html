<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dep. Infantil - Gestão</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .sala-badge { padding: 4px 8px; border-radius: 12px; font-size: 0.8em; font-weight: bold; }
        .sala-0-2 { background-color: #FECACA; color: #991B1B; } 
        .sala-3-5 { background-color: #FEF3C7; color: #92400E; }
        .sala-6-8 { background-color: #D1FAE5; color: #065F46; }
        .sala-9-12 { background-color: #DBEAFE; color: #1E40AF; }
        
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; }
        
        /* Correção para inputs */
        input, select { border: 1px solid #ccc; padding: 8px; border-radius: 5px; width: 100%; }
        button { cursor: pointer; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="bg-indigo-600 text-white p-4 shadow-lg flex justify-between items-center z-10">
        <h1 class="text-xl font-bold"><i class="fa-solid fa-shapes"></i> Kids System</h1>
        <div id="status-connection" class="text-sm font-bold bg-indigo-800 px-3 py-1 rounded">Verificando...</div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <nav class="w-20 md:w-64 bg-white shadow-md flex flex-col justify-between">
            <div class="flex flex-col py-4 space-y-2">
                <button onclick="showTab('dashboard')" class="p-4 hover:bg-indigo-50 text-indigo-700 font-medium text-left">
                    <i class="fa-solid fa-chart-pie w-6"></i> <span class="hidden md:inline ml-2">Dashboard</span>
                </button>
                <button onclick="showTab('professores')" class="p-4 hover:bg-indigo-50 text-gray-600 hover:text-indigo-700 font-medium text-left">
                    <i class="fa-solid fa-chalkboard-user w-6"></i> <span class="hidden md:inline ml-2">Professores</span>
                </button>
                <button onclick="showTab('escala')" class="p-4 hover:bg-indigo-50 text-gray-600 hover:text-indigo-700 font-medium text-left">
                    <i class="fa-solid fa-calendar-days w-6"></i> <span class="hidden md:inline ml-2">Escala</span>
                </button>
                <button onclick="showTab('criancas')" class="p-4 hover:bg-indigo-50 text-gray-600 hover:text-indigo-700 font-medium text-left">
                    <i class="fa-solid fa-child w-6"></i> <span class="hidden md:inline ml-2">Crianças</span>
                </button>
                <button onclick="showTab('checkin')" class="p-4 hover:bg-indigo-50 text-gray-600 hover:text-indigo-700 font-medium text-left">
                    <i class="fa-solid fa-qrcode w-6"></i> <span class="hidden md:inline ml-2">Check-in</span>
                </button>
            </div>
        </nav>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50">
            
            <div id="dashboard" class="tab-content active">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">Dashboard</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                    <div class="card border-l-4 border-indigo-500">
                        <div class="text-gray-500 text-sm">Crianças Presentes</div>
                        <div class="text-3xl font-bold text-indigo-600" id="dash-presentes">-</div>
                    </div>
                    <div class="card border-l-4 border-green-500">
                        <div class="text-gray-500 text-sm">Total Cadastrados</div>
                        <div class="text-3xl font-bold text-green-600" id="dash-total">-</div>
                    </div>
                    <div class="card border-l-4 border-yellow-500">
                        <div class="text-gray-500 text-sm">Escalados Hoje</div>
                        <div class="text-3xl font-bold text-yellow-600" id="dash-professores">-</div>
                    </div>
                </div>
                <div class="card">
                    <h3 class="font-bold mb-4">Gráfico de Presença (Hoje)</h3>
                    <div style="height: 300px;"><canvas id="chartPresenca"></canvas></div>
                </div>
            </div>

            <div id="professores" class="tab-content">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Professores</h2>
                    <button onclick="openModal('modal-professor')" class="bg-indigo-600 text-white px-4 py-2 rounded shadow">
                        + Novo
                    </button>
                </div>
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="min-w-full"><tbody id="tabela-professores"></tbody></table>
                </div>
            </div>

            <div id="escala" class="tab-content">
                <h2 class="text-2xl font-bold mb-6">Escala</h2>
                <div class="card max-w-2xl mx-auto">
                    <label class="block mb-2 font-bold">Data</label>
                    <input type="date" id="escala-data" class="mb-4">
                    
                    <label class="block mb-2 font-bold">Sala</label>
                    <select id="escala-sala" class="mb-4">
                        <option value="0 a 2">0 a 2 anos</option>
                        <option value="3 a 5">3 a 5 anos</option>
                        <option value="6 a 8">6 a 8 anos</option>
                        <option value="9 a 12">9 a 12 anos</option>
                    </select>

                    <label class="block mb-2 font-bold">Professores</label>
                    <div id="lista-selecao-professores" class="grid grid-cols-2 gap-2 p-2 border rounded bg-gray-50 mb-4 h-32 overflow-y-auto"></div>

                    <button onclick="salvarEscala()" class="w-full bg-green-600 text-white p-3 rounded font-bold hover:bg-green-700">Salvar Escala</button>
                </div>
                <div id="lista-escalas" class="grid gap-4 md:grid-cols-2 mt-8"></div>
            </div>

            <div id="criancas" class="tab-content">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Crianças</h2>
                    <button onclick="openModal('modal-crianca')" class="bg-indigo-600 text-white px-4 py-2 rounded shadow">+ Nova</button>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-white rounded shadow p-4 overflow-x-auto">
                        <table class="w-full text-left"><tbody id="tabela-criancas"></tbody></table>
                    </div>
                    <div class="card flex flex-col items-center text-center">
                        <h3 class="font-bold text-gray-600">QR Code</h3>
                        <div id="qrcode-display" class="my-4"></div>
                        <p id="qrcode-nome" class="font-bold text-indigo-600"></p>
                    </div>
                </div>
            </div>

            <div id="checkin" class="tab-content">
                <div class="max-w-md mx-auto mt-10 card text-center">
                    <i class="fa-solid fa-camera fa-3x text-indigo-600 mb-4"></i>
                    <h2 class="text-2xl font-bold">Scanner</h2>
                    <input type="text" id="scanner-input" placeholder="Clique aqui e leia o QR..." class="my-4 text-center text-lg p-3 border-2 border-indigo-200" autofocus>
                    <div id="scan-result" class="hidden p-4 rounded mt-4"></div>
                </div>
            </div>

        </main>
    </div>

    <div id="modal-professor" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg w-96 shadow-xl">
            <h3 class="text-xl font-bold mb-4">Novo Professor</h3>
            <input type="text" id="prof-nome" placeholder="Nome" class="mb-2">
            <select id="prof-sala" class="mb-4">
                <option value="0 a 2">0 a 2 anos</option>
                <option value="3 a 5">3 a 5 anos</option>
                <option value="6 a 8">6 a 8 anos</option>
                <option value="9 a 12">9 a 12 anos</option>
            </select>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('modal-professor')" class="bg-gray-300 px-4 py-2 rounded">Cancelar</button>
                <button onclick="saveProfessor()" class="bg-indigo-600 text-white px-4 py-2 rounded">Salvar</button>
            </div>
        </div>
    </div>

    <div id="modal-crianca" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg w-96 shadow-xl">
            <h3 class="text-xl font-bold mb-4">Nova Criança</h3>
            <input type="text" id="crianca-nome" placeholder="Nome" class="mb-2">
            <input type="number" id="crianca-idade" placeholder="Idade" class="mb-2" onchange="calcSala()">
            <input type="text" id="crianca-sala" placeholder="Sala" class="mb-2 bg-gray-100" readonly>
            <input type="text" id="crianca-resp" placeholder="Responsável" class="mb-4">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('modal-crianca')" class="bg-gray-300 px-4 py-2 rounded">Cancelar</button>
                <button onclick="saveCrianca()" class="bg-indigo-600 text-white px-4 py-2 rounded">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ÁREA DE CONFIGURAÇÃO (EDITE AQUI!!!)
        // ==========================================
        
        // 1. Apague o texto entre aspas e coloque a URL do seu Supabase (ex: https://abcedf.supabase.co)
        const SUPABASE_URL = 'https://nekbbkenxcukoortusge.supabase.co'; 
        
        // 2. Apague o texto entre aspas e coloque a chave "anon" "public"
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5la2Jia2VueGN1a29vcnR1c2dlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMzOTU5MDIsImV4cCI6MjA3ODk3MTkwMn0.D72914Vyz1du1ZDKoNDdwT7YI-D8WPgZe38LbBV2bfc'; 
        
        // ==========================================

        let supabase;

        // INICIALIZAÇÃO
        window.onload = function() {
            if (SUPABASE_URL.includes('SEU_PROJETO') || SUPABASE_KEY.includes('SUA_CHAVE')) {
                alert("PARE! Você não configurou as chaves no código HTML. Edite o arquivo e coloque seus dados nas linhas 250 e 253.");
                document.getElementById('status-connection').innerText = 'Falta Configuração';
                document.getElementById('status-connection').classList.add('bg-red-500');
                return;
            }

            try {
                supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                checkConnection();
            } catch (error) {
                console.error("Erro crítico:", error);
                alert("Erro ao iniciar Supabase. Verifique o console (F12).");
            }
        };

        async function checkConnection() {
            const statusDiv = document.getElementById('status-connection');
            // Tenta buscar algo simples
            const { error } = await supabase.from('professores').select('count', { count: 'exact', head: true });
            
            if (error) {
                console.error("Erro de Conexão:", error);
                statusDiv.innerText = 'Erro: ' + error.message;
                statusDiv.classList.add('bg-red-600');
                if(error.code === 'PGRST301') alert("As tabelas não existem ou você não tem permissão (RLS). Rode o script SQL enviado.");
            } else {
                statusDiv.innerText = 'Online';
                statusDiv.classList.remove('bg-indigo-800');
                statusDiv.classList.add('bg-green-500');
                loadDashboard();
            }
        }

        // NAVEGAÇÃO
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'dashboard') loadDashboard();
            if(id === 'professores') loadProfessores();
            if(id === 'escala') loadEscalaUI();
            if(id === 'criancas') loadCriancas();
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

        // UTILITÁRIOS
        function getSala(idade) {
            if (idade <= 2) return "0 a 2";
            if (idade <= 5) return "3 a 5";
            if (idade <= 8) return "6 a 8";
            if (idade <= 12) return "9 a 12";
            return "Indefinido";
        }
        function calcSala() { document.getElementById('crianca-sala').value = getSala(document.getElementById('crianca-idade').value); }
        function getSalaBadge(sala) {
            let color = 'bg-gray-200';
            if(sala.includes('0 a 2')) color = 'sala-0-2';
            if(sala.includes('3 a 5')) color = 'sala-3-5';
            if(sala.includes('6 a 8')) color = 'sala-6-8';
            if(sala.includes('9 a 12')) color = 'sala-9-12';
            return `<span class="sala-badge ${color}">${sala}</span>`;
        }

        // LÓGICA: PROFESSORES
        async function loadProfessores() {
            const { data, error } = await supabase.from('professores').select('*');
            if(error) return console.error(error);
            document.getElementById('tabela-professores').innerHTML = data.map(p => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3 font-bold">${p.nome}</td>
                    <td class="p-3">${getSalaBadge(p.sala_preferencia)}</td>
                    <td class="p-3 text-right"><button onclick="delProf(${p.id})" class="text-red-500 hover:underline">Excluir</button></td>
                </tr>
            `).join('');
        }
        async function saveProfessor() {
            const nome = document.getElementById('prof-nome').value;
            const sala = document.getElementById('prof-sala').value;
            if(!nome) return alert('Nome obrigatório');
            await supabase.from('professores').insert([{ nome, sala_preferencia: sala }]);
            closeModal('modal-professor'); loadProfessores();
        }
        async function delProf(id) {
            if(confirm('Excluir?')) { await supabase.from('professores').delete().eq('id', id); loadProfessores(); }
        }

        // LÓGICA: CRIANÇAS
        async function loadCriancas() {
            const { data } = await supabase.from('criancas').select('*');
            document.getElementById('tabela-criancas').innerHTML = data.map(c => `
                <tr class="border-b hover:bg-indigo-50 cursor-pointer" onclick="verQR('${c.nome}', '${c.sala}', '${c.qrcode_hash}')">
                    <td class="p-3">${c.nome}</td>
                    <td class="p-3">${c.idade} anos</td>
                    <td class="p-3">${getSalaBadge(c.sala)}</td>
                </tr>
            `).join('');
        }
        async function saveCrianca() {
            const nome = document.getElementById('crianca-nome').value;
            const idade = document.getElementById('crianca-idade').value;
            if(!nome || !idade) return alert('Preencha tudo');
            await supabase.from('criancas').insert([{ nome, idade, sala: getSala(idade), nome_responsavel: document.getElementById('crianca-resp').value }]);
            closeModal('modal-crianca'); loadCriancas();
        }
        function verQR(nome, sala, hash) {
            document.getElementById('qrcode-display').innerHTML = '';
            document.getElementById('qrcode-nome').innerText = nome;
            new QRCode(document.getElementById("qrcode-display"), { text: hash, width: 128, height: 128 });
        }

        // LÓGICA: ESCALA
        async function loadEscalaUI() {
            const { data } = await supabase.from('professores').select('*');
            document.getElementById('lista-selecao-professores').innerHTML = data.map(p => `
                <label class="flex items-center space-x-2 bg-white p-2 rounded border">
                    <input type="checkbox" value="${p.nome}"> <span>${p.nome}</span>
                </label>
            `).join('');
            
            const { data: escalas } = await supabase.from('escala2').select('*').order('data_culto', {ascending:false}).limit(6);
            document.getElementById('lista-escalas').innerHTML = escalas.map(e => {
                let profs = e.professores_ids;
                try { if(typeof profs === 'string') profs = JSON.parse(profs); } catch(err){}
                return `
                <div class="card border-l-4 border-indigo-400">
                    <div class="font-bold">${new Date(e.data_culto).toLocaleDateString()}</div>
                    <div class="mb-2">${getSalaBadge(e.sala)}</div>
                    <div class="text-sm text-gray-600">${Array.isArray(profs) ? profs.join(', ') : profs}</div>
                </div>`;
            }).join('');
        }
        async function salvarEscala() {
            const data = document.getElementById('escala-data').value;
            const sala = document.getElementById('escala-sala').value;
            const profs = Array.from(document.querySelectorAll('#lista-selecao-professores input:checked')).map(cb => cb.value);
            if(!data || profs.length === 0) return alert('Data e Professores obrigatórios');
            
            await supabase.from('escala2').insert([{ data_culto: data, sala, professores_ids: JSON.stringify(profs) }]);
            alert('Salvo!'); loadEscalaUI();
        }

        // LÓGICA: SCANNER
        let timeout;
        document.getElementById('scanner-input').addEventListener('input', (e) => {
            clearTimeout(timeout);
            timeout = setTimeout(() => processCheckin(e.target.value), 500);
        });

        async function processCheckin(hash) {
            if(!hash) return;
            const res = document.getElementById('scan-result');
            document.getElementById('scanner-input').value = '';
            
            const { data: c } = await supabase.from('criancas').select('*').eq('qrcode_hash', hash).single();
            if(!c) { res.className = 'bg-red-100 text-red-800 p-4 block'; res.innerText = 'QR Code não encontrado'; return; }

            const hoje = new Date().toISOString().split('T')[0];
            const { data: p } = await supabase.from('presenca').select('*').eq('crianca_id', c.id).eq('data_culto', hoje).single();

            if(!p) {
                await supabase.from('presenca').insert([{ crianca_id: c.id, data_culto: hoje, checkin: new Date().toISOString() }]);
                res.className = 'bg-green-100 text-green-800 p-4 block';
                res.innerHTML = `<b>Entrada:</b> ${c.nome} (${c.sala})`;
            } else if(!p.checkout) {
                await supabase.from('presenca').update({ checkout: new Date().toISOString() }).eq('id', p.id);
                res.className = 'bg-blue-100 text-blue-800 p-4 block';
                res.innerHTML = `<b>Saída:</b> ${c.nome}`;
            } else {
                res.className = 'bg-yellow-100 text-yellow-800 p-4 block';
                res.innerText = 'Já finalizado hoje.';
            }
            loadDashboard(); // Atualiza contadores
        }

        // LÓGICA: DASHBOARD
        let myChart;
        async function loadDashboard() {
            const hoje = new Date().toISOString().split('T')[0];
            
            // 1. Contadores
            const { count: total } = await supabase.from('criancas').select('*', { count: 'exact', head: true });
            const { count: presentes } = await supabase.from('presenca').select('*', { count: 'exact', head: true }).eq('data_culto', hoje).is('checkout', null);
            
            // 2. Professores Escalados (Lógica manual pois JSONB varia)
            const { data: escalas } = await supabase.from('escala2').select('professores_ids').eq('data_culto', hoje);
            let totalProfs = 0;
            escalas.forEach(e => {
                try { 
                    let lista = (typeof e.professores_ids === 'string') ? JSON.parse(e.professores_ids) : e.professores_ids;
                    if(Array.isArray(lista)) totalProfs += lista.length;
                } catch(err){}
            });

            document.getElementById('dash-total').innerText = total || 0;
            document.getElementById('dash-presentes').innerText = presentes || 0;
            document.getElementById('dash-professores').innerText = totalProfs;

            // 3. Gráfico
            const { data: pList } = await supabase.from('presenca').select('criancas(sala)').eq('data_culto', hoje).is('checkout', null);
            const counts = { '0 a 2': 0, '3 a 5': 0, '6 a 8': 0, '9 a 12': 0 };
            pList.forEach(item => { if(item.criancas && counts[item.criancas.sala] !== undefined) counts[item.criancas.sala]++; });

            const ctx = document.getElementById('chartPresenca').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(counts),
                    datasets: [{ label: 'Crianças', data: Object.values(counts), backgroundColor: ['#FECACA', '#FEF3C7', '#D1FAE5', '#DBEAFE'] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dept Infantil - Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        .active-tab { background-color: #2563eb; color: white; }
        .hidden-section { display: none; }
        body { background-color: #f3f4f6; }
        /* Animação de carregamento */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <div id="status-bar" class="bg-gray-800 text-white text-xs p-1 text-center flex justify-center items-center gap-2">
        <span id="status-icon" class="loader"></span>
        <span id="status-text">Conectando ao Supabase...</span>
    </div>

    <div class="flex flex-1 overflow-hidden flex-col md:flex-row">
        <aside class="w-full md:w-64 bg-white shadow-lg flex-shrink-0 flex flex-col z-20">
            <div class="p-6 bg-blue-700 text-white font-bold text-lg">
                <i class="fas fa-shapes"></i> Kids Admin
            </div>
            <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-2">
                <button onclick="nav('dashboard')" id="btn-dashboard" class="w-full text-left py-3 px-4 rounded hover:bg-blue-50 active-tab"><i class="fas fa-chart-line w-6"></i> Dashboard</button>
                <button onclick="nav('checkin')" id="btn-checkin" class="w-full text-left py-3 px-4 rounded hover:bg-blue-50"><i class="fas fa-qrcode w-6"></i> Check-in / Saída</button>
                <button onclick="nav('professores')" id="btn-professores" class="w-full text-left py-3 px-4 rounded hover:bg-blue-50"><i class="fas fa-chalkboard-teacher w-6"></i> Professores</button>
                <button onclick="nav('escala')" id="btn-escala" class="w-full text-left py-3 px-4 rounded hover:bg-blue-50"><i class="fas fa-calendar-alt w-6"></i> Escala V2</button>
            </nav>
        </aside>

        <main class="flex-1 overflow-y-auto p-4 bg-gray-100">
            
            <section id="dashboard">
                <h2 class="text-2xl font-bold mb-4">Painel Principal</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                        <div class="text-gray-500 text-xs uppercase">Crianças Hoje</div>
                        <div class="text-2xl font-bold" id="dash-kids">0</div>
                    </div>
                    <div class="bg-white p-4 rounded shadow border-l-4 border-purple-500">
                        <div class="text-gray-500 text-xs uppercase">Professores</div>
                        <div class="text-2xl font-bold" id="dash-profs">0</div>
                    </div>
                </div>
                <div class="bg-white p-4 rounded shadow h-64">
                    <canvas id="chartKids"></canvas>
                </div>
            </section>

            <section id="checkin" class="hidden-section">
                <h2 class="text-2xl font-bold mb-4">Leitor QR Code</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded shadow">
                        <div id="reader" class="w-full h-64 bg-black"></div>
                        <p class="text-xs text-center mt-2 text-gray-500">Use HTTPS ou Localhost para a câmera funcionar.</p>
                        
                        <div id="checkin-form" class="hidden mt-4 border-t pt-2">
                            <h3 class="font-bold text-green-700">Entrada Detectada</h3>
                            <input type="hidden" id="in-qr">
                            <input id="in-name" placeholder="Nome" class="w-full border p-2 mb-2 rounded">
                            <div class="flex gap-2 mb-2">
                                <input id="in-age" type="number" placeholder="Idade" class="w-full border p-2 rounded" onchange="autoSala()">
                                <select id="in-sala" class="w-full border p-2 rounded bg-gray-100">
                                    <option value="0-2">0-2 anos</option>
                                    <option value="3-5">3-5 anos</option>
                                    <option value="6-8">6-8 anos</option>
                                    <option value="9-12">9-12 anos</option>
                                </select>
                            </div>
                            <input id="in-resp" placeholder="Responsável" class="w-full border p-2 mb-2 rounded">
                            <button onclick="doCheckin()" class="w-full bg-green-600 text-white p-2 rounded font-bold">Confirmar Presença</button>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded shadow">
                        <h3 class="font-bold mb-2">Na Sala Agora</h3>
                        <div id="active-list" class="text-sm space-y-2 max-h-96 overflow-y-auto"></div>
                    </div>
                </div>
            </section>

            <section id="professores" class="hidden-section">
                <h2 class="text-2xl font-bold mb-4">Professores</h2>
                <div class="bg-white p-4 rounded shadow mb-4 flex gap-2">
                    <input id="new-prof-name" placeholder="Nome" class="border p-2 rounded flex-1">
                    <select id="new-prof-sala" class="border p-2 rounded">
                        <option value="0-2">0-2</option><option value="3-5">3-5</option><option value="6-8">6-8</option><option value="9-12">9-12</option>
                    </select>
                    <button onclick="saveProf()" class="bg-blue-600 text-white px-4 rounded">Add</button>
                </div>
                <div id="prof-list" class="bg-white rounded shadow p-4 space-y-2">Carregando...</div>
            </section>

            <section id="escala" class="hidden-section">
                <h2 class="text-2xl font-bold mb-4">Escala V2</h2>
                <div class="bg-white p-4 rounded shadow mb-4 grid grid-cols-1 md:grid-cols-3 gap-2">
                    <input type="date" id="esc-date" class="border p-2 rounded">
                    <select id="esc-sala" class="border p-2 rounded" onchange="loadProfsForSelect()">
                        <option value="0-2">Sala 0-2</option>
                        <option value="3-5">Sala 3-5</option>
                        <option value="6-8">Sala 6-8</option>
                        <option value="9-12">Sala 9-12</option>
                    </select>
                    <select id="esc-prof" class="border p-2 rounded">
                        <option>Selecione a Sala Primeiro</option>
                    </select>
                    <button onclick="saveEscala()" class="bg-purple-600 text-white p-2 rounded col-span-full md:col-span-1">Escalar</button>
                </div>
                <div id="escala-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>

        </main>
    </div>

    <script>
        // CONFIGURAÇÃO
        const SUPABASE_URL = 'https://nekbbkenxcukoortusge.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5la2Jia2VueGN1a29vcnR1c2dlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMzOTU5MDIsImV4cCI6MjA3ODk3MTkwMn0.D72914Vyz1du1ZDKoNDdwT7YI-D8WPgZe38LbBV2bfc';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // INICIALIZAÇÃO E TESTE DE CONEXÃO
        async function init() {
            try {
                const { data, error } = await supabase.from('professores').select('count').limit(1);
                const statusEl = document.getElementById('status-bar');
                const icon = document.getElementById('status-icon');
                const text = document.getElementById('status-text');

                if (error) throw error;

                statusEl.classList.remove('bg-gray-800');
                statusEl.classList.add('bg-green-600');
                icon.classList.remove('loader');
                icon.innerHTML = '<i class="fas fa-check"></i>';
                text.innerText = "Conectado ao Banco de Dados com Sucesso!";
                
                // Carregar dados iniciais
                loadDashboard();
            } catch (e) {
                console.error(e);
                const statusEl = document.getElementById('status-bar');
                statusEl.classList.remove('bg-gray-800');
                statusEl.classList.add('bg-red-600');
                document.getElementById('status-text').innerText = "ERRO: " + e.message + ". Verifique se rodou o SQL no Supabase.";
            }
        }
        init();

        // NAVEGAÇÃO
        function nav(section) {
            document.querySelectorAll('section').forEach(el => el.classList.add('hidden-section'));
            document.getElementById(section).classList.remove('hidden-section');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
            document.getElementById('btn-'+section).classList.add('active-tab');

            if(section === 'professores') loadProfs();
            if(section === 'escala') { loadEscalaList(); loadProfsForSelect(); }
            if(section === 'checkin') startCamera();
            else stopCamera();
            if(section === 'dashboard') loadDashboard();
        }

        // --- MÓDULO: PROFESSORES ---
        async function loadProfs() {
            const { data } = await supabase.from('professores').select('*').order('nome');
            const div = document.getElementById('prof-list');
            div.innerHTML = '';
            data?.forEach(p => {
                div.innerHTML += `<div class="flex justify-between border-b py-2">
                    <span><b>${p.nome}</b> (${p.sala_preferencia})</span>
                    <button onclick="delProf('${p.id}')" class="text-red-500"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        }

        async function saveProf() {
            const nome = document.getElementById('new-prof-name').value;
            const sala = document.getElementById('new-prof-sala').value;
            if(!nome) return alert('Digite o nome');
            await supabase.from('professores').insert([{nome, sala_preferencia: sala}]);
            document.getElementById('new-prof-name').value = '';
            loadProfs();
        }

        async function delProf(id) {
            if(confirm('Excluir?')) {
                await supabase.from('professores').delete().eq('id', id);
                loadProfs();
            }
        }

        // --- MÓDULO: ESCALA 2 ---
        async function loadProfsForSelect() {
            const sala = document.getElementById('esc-sala').value;
            const { data } = await supabase.from('professores').select('*').eq('sala_preferencia', sala);
            const sel = document.getElementById('esc-prof');
            sel.innerHTML = '';
            if(!data || data.length === 0) sel.innerHTML = '<option>Sem professores para esta sala</option>';
            data?.forEach(p => {
                sel.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
            });
        }

        async function saveEscala() {
            const dataCulto = document.getElementById('esc-date').value;
            const sala = document.getElementById('esc-sala').value;
            const pid = document.getElementById('esc-prof').value;

            if(!dataCulto || !pid) return alert('Preencha tudo');

            const { error } = await supabase.from('Escala2').insert([{
                data_culto: dataCulto,
                sala: sala,
                professor_id: pid
            }]);

            if(error) alert('Erro ao salvar: ' + error.message);
            else { alert('Escalado!'); loadEscalaList(); }
        }

        async function loadEscalaList() {
            const { data } = await supabase.from('Escala2').select('*, professores(nome)').order('data_culto', {ascending: true});
            const div = document.getElementById('escala-list');
            div.innerHTML = '';
            data?.forEach(e => {
                div.innerHTML += `<div class="bg-gray-50 p-2 border rounded">
                    <div class="font-bold text-blue-600">${e.data_culto}</div>
                    <div>${e.sala}: ${e.professores?.nome || 'Prof Excluído'}</div>
                </div>`;
            });
        }

        // --- MÓDULO: CHECKIN (QR & CAM) ---
        let scanner = null;
        function startCamera() {
            if(scanner) return;
            scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10 }, onScan).catch(err => {
                console.error(err);
                alert("Erro ao abrir câmera. Certifique-se que está usando HTTPS ou Localhost (não file://).");
            });
            loadActiveKids();
        }
        function stopCamera() {
            if(scanner) scanner.stop().then(() => scanner.clear());
            scanner = null;
        }

        async function onScan(qr) {
            // Verificar status
            const { data: existente } = await supabase.from('frequencia')
                .select('*').eq('qr_id', qr).is('hora_saida', null).maybeSingle();

            if(existente) {
                // Checkout
                if(confirm(`Realizar SAÍDA de ${existente.nome_crianca}?`)) {
                    await supabase.from('frequencia').update({hora_saida: new Date(), status: 'finalizado'}).eq('id', existente.id);
                    alert("Saída Registrada!");
                    loadActiveKids();
                }
            } else {
                // Checkin
                document.getElementById('checkin-form').classList.remove('hidden');
                document.getElementById('in-qr').value = qr;
                // Tenta puxar dados antigos
                const { data: old } = await supabase.from('frequencia').select('*').eq('qr_id', qr).limit(1).maybeSingle();
                if(old) {
                    document.getElementById('in-name').value = old.nome_crianca;
                    document.getElementById('in-age').value = old.idade;
                    document.getElementById('in-resp').value = old.responsavel_nome;
                    autoSala();
                }
            }
        }

        function autoSala() {
            const age = document.getElementById('in-age').value;
            const s = document.getElementById('in-sala');
            if(age <= 2) s.value="0-2"; else if(age<=5) s.value="3-5"; else if(age<=8) s.value="6-8"; else s.value="9-12";
        }

        async function doCheckin() {
            const obj = {
                qr_id: document.getElementById('in-qr').value,
                nome_crianca: document.getElementById('in-name').value,
                idade: document.getElementById('in-age').value,
                sala: document.getElementById('in-sala').value,
                responsavel_nome: document.getElementById('in-resp').value,
                data_culto: new Date().toISOString()
            };
            if(!obj.nome_crianca) return alert("Preencha o nome");
            
            const { error } = await supabase.from('frequencia').insert([obj]);
            if(error) alert("Erro: " + error.message);
            else {
                document.getElementById('checkin-form').classList.add('hidden');
                document.getElementById('in-name').value = '';
                alert("Entrada OK!");
                loadActiveKids();
            }
        }

        async function loadActiveKids() {
            const { data } = await supabase.from('frequencia').select('*').is('hora_saida', null);
            document.getElementById('active-list').innerHTML = data.map(k => 
                `<div class="bg-green-100 p-2 rounded flex justify-between"><span>${k.nome_crianca} (${k.sala})</span></div>`
            ).join('');
        }

        // --- DASHBOARD ---
        async function loadDashboard() {
            const { count: k } = await supabase.from('frequencia').select('*', {count: 'exact', head: true}).is('hora_saida', null);
            document.getElementById('dash-kids').innerText = k || 0;

            // Escala do dia
            const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
            // Para demo, vamos pegar total geral se hoje for zero
            const { count: p } = await supabase.from('Escala2').select('*', {count: 'exact', head: true});
            document.getElementById('dash-profs').innerText = p || 0;

            // Chart
            const ctx = document.getElementById('chartKids');
            if(window.myChart) window.myChart.destroy();
            window.myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Kids', 'Profs'],
                    datasets: [{ label: 'Total', data: [k, p], backgroundColor: ['blue', 'purple'] }]
                }
            });
        }

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departamento Infantil - Gestão Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .scanner-box { width: 100%; max-width: 400px; margin: 0 auto; }
        /* Scroll suave para listas */
        .kid-list { max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <nav class="bg-indigo-600 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fas fa-child"></i> Dept. Infantil</h1>
            <div class="space-x-2 text-sm hidden md:block">
                <button onclick="showTab('dashboard')" class="hover:text-indigo-200 font-medium">Painel Hoje</button>
                <button onclick="showTab('historico')" class="hover:text-indigo-200 font-medium">Histórico</button>
                <button onclick="showTab('professores')" class="hover:text-indigo-200 font-medium">Professores</button>
                <button onclick="showTab('escala')" class="hover:text-indigo-200 font-medium">Escala</button>
                <button onclick="showTab('criancas')" class="hover:text-indigo-200 font-medium">Cadastro</button>
                <button onclick="showTab('qrcode')" class="bg-white text-indigo-600 px-3 py-1 rounded-full font-bold">Check-in/Out</button>
            </div>
        </div>
        <div class="flex justify-around md:hidden mt-2 text-xs overflow-x-auto py-2">
            <button onclick="showTab('dashboard')" class="px-2">Hoje</button>
            <button onclick="showTab('historico')" class="px-2">Histórico</button>
            <button onclick="showTab('professores')" class="px-2">Profs</button>
            <button onclick="showTab('escala')" class="px-2">Escala</button>
            <button onclick="showTab('criancas')" class="px-2">Cad.</button>
            <button onclick="showTab('qrcode')" class="font-bold text-yellow-300 px-2">QR</button>
        </div>
    </nav>

    <main class="container mx-auto p-4 flex-grow overflow-y-auto pb-20">

        <div id="dashboard" class="tab-content active">
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-2xl font-bold text-gray-800">Painel Ao Vivo (Hoje)</h2>
                <button onclick="carregarDashboard()" class="text-indigo-600 text-sm"><i class="fas fa-sync"></i> Atualizar</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-blue-600 text-white p-4 rounded-lg shadow">
                    <h3 class="text-blue-100 text-sm">Total Crianças Presentes</h3>
                    <p class="text-4xl font-bold" id="dash-total-kids">0</p>
                </div>
            </div>

            <div id="painel-salas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            </div>
        </div>

        <div id="historico" class="tab-content">
            <h2 class="text-2xl font-bold mb-4">Histórico / Relatório</h2>
            <div class="bg-white p-4 rounded shadow mb-6 flex flex-col md:flex-row gap-4 items-end">
                <div class="w-full">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Selecione a Data:</label>
                    <input type="date" id="hist-data" class="border p-2 rounded w-full">
                </div>
                <button onclick="buscarHistorico()" class="bg-indigo-600 text-white px-6 py-2 rounded w-full md:w-auto h-10">Buscar</button>
            </div>

            <div id="hist-resultado" class="space-y-6">
                <p class="text-gray-500 text-center mt-10">Selecione uma data para ver o relatório completo.</p>
            </div>
        </div>

        <div id="professores" class="tab-content">
            <h2 class="text-2xl font-bold mb-4">Professores</h2>
            <div class="bg-white p-4 rounded shadow mb-4">
                <div class="flex flex-col md:flex-row gap-2">
                    <input type="text" id="prof-nome" placeholder="Nome" class="border p-2 rounded flex-grow">
                    <select id="prof-sala" class="border p-2 rounded">
                        <option value="">Sala Preferência</option>
                        <option value="0-2">0-2 anos</option>
                        <option value="3-5">3-5 anos</option>
                        <option value="6-8">6-8 anos</option>
                        <option value="9-12">9-12 anos</option>
                    </select>
                    <button onclick="addProfessor()" class="bg-green-600 text-white px-4 py-2 rounded">Adicionar</button>
                </div>
            </div>
            <div class="bg-white rounded shadow overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-100"><tr><th class="p-3">Nome</th><th class="p-3">Sala</th><th class="p-3">Excluir</th></tr></thead>
                    <tbody id="lista-professores"></tbody>
                </table>
            </div>
        </div>

        <div id="criancas" class="tab-content">
            <h2 class="text-2xl font-bold mb-4">Cadastro de Criança</h2>
            <div class="bg-white p-6 rounded shadow mb-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="kid-nome" placeholder="Nome da Criança" class="border p-2 rounded w-full">
                    <input type="date" id="kid-nasc" class="border p-2 rounded w-full" title="Data Nascimento">
                    <input type="text" id="kid-resp" placeholder="Nome do Responsável" class="border p-2 rounded w-full">
                    <select id="kid-sala" class="border p-2 rounded w-full">
                        <option value="">Sala Automática (por Idade)</option>
                        <option value="0-2">Fixar: 0 a 2 anos</option>
                        <option value="3-5">Fixar: 3 a 5 anos</option>
                        <option value="6-8">Fixar: 6 a 8 anos</option>
                        <option value="9-12">Fixar: 9 a 12 anos</option>
                    </select>
                    <input type="text" id="kid-qr" placeholder="Número QR Code (Fixo)" class="border p-2 rounded w-full font-mono bg-yellow-50">
                </div>
                <button onclick="addCrianca()" class="mt-4 bg-indigo-600 text-white px-6 py-2 rounded w-full font-bold">Salvar Cadastro</button>
            </div>
            
            <div class="bg-white p-4 rounded shadow">
                <h3 class="font-bold mb-2 text-gray-600 border-b pb-2">Últimos Cadastros</h3>
                <div id="lista-criancas" class="max-h-60 overflow-y-auto"></div>
            </div>
        </div>

        <div id="escala" class="tab-content">
            <h2 class="text-2xl font-bold mb-4">Escala de Professores</h2>
            <div class="bg-white p-4 rounded shadow mb-4 border-l-4 border-orange-400">
                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="font-bold block text-sm">Data do Culto:</label>
                        <input type="date" id="escala-data" class="border p-2 rounded w-full">
                    </div>
                    <div>
                        <label class="font-bold block text-sm">Sala:</label>
                        <select id="escala-sala" class="border p-2 rounded w-full">
                            <option value="0-2">0 a 2 anos</option>
                            <option value="3-5">3 a 5 anos</option>
                            <option value="6-8">6 a 8 anos</option>
                            <option value="9-12">9 a 12 anos</option>
                        </select>
                    </div>
                    <div>
                        <p class="font-bold text-sm mb-1">Professores (Múltipla escolha):</p>
                        <div id="escala-prof-select" class="h-32 overflow-y-auto border p-2 rounded bg-gray-50 grid grid-cols-2 gap-2"></div>
                    </div>
                    <button onclick="salvarEscala()" class="bg-orange-500 text-white px-4 py-2 rounded font-bold">Salvar na Escala</button>
                </div>
            </div>
            <div id="lista-escalas" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <div id="qrcode" class="tab-content">
            <h2 class="text-2xl font-bold mb-4 text-center">Entrada / Saída</h2>
            
            <div class="bg-white p-4 rounded shadow max-w-md mx-auto">
                <div class="scanner-box bg-black rounded overflow-hidden mb-4 relative">
                    <div id="reader" style="width: 100%;"></div>
                    <div class="absolute top-0 left-0 w-full h-full border-2 border-red-500 opacity-20 pointer-events-none"></div>
                </div>

                <div class="flex gap-2 justify-center mb-4">
                    <input type="text" id="manual-qr" placeholder="Digitar Cód." class="border p-2 rounded w-24 text-center text-lg font-mono">
                    <button onclick="processarCheckinManual()" class="bg-gray-800 text-white px-4 rounded"><i class="fas fa-arrow-right"></i></button>
                </div>

                <div id="qr-result" class="hidden text-center border rounded p-4">
                    <h3 id="qr-msg-title" class="text-2xl font-bold mb-1"></h3>
                    <p id="qr-msg-body" class="text-lg"></p>
                    <div id="qr-msg-details" class="mt-2 text-sm text-gray-600 bg-gray-100 p-2 rounded"></div>
                    <p id="qr-msg-time" class="text-xs text-gray-400 mt-2"></p>
                </div>
            </div>
        </div>

    </main>

    <script>
        // --- CONFIGURAÇÃO (SUAS CHAVES) ---
        const supabaseUrl = 'https://nekbbkenxcukoortusge.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5la2Jia2VueGN1a29vcnR1c2dlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMzOTU5MDIsImV4cCI6MjA3ODk3MTkwMn0.D72914Vyz1du1ZDKoNDdwT7YI-D8WPgZe38LbBV2bfc'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // --- NAVEGAÇÃO ---
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            // Lógica ao abrir abas
            if(tabId === 'professores') carregarProfessores();
            if(tabId === 'escala') { carregarProfessoresCheckbox(); carregarEscalas(); }
            if(tabId === 'dashboard') carregarDashboard();
            if(tabId === 'criancas') carregarCriancas();
            if(tabId === 'qrcode') startScanner();
            else stopScanner();
        }

        // ==========================================
        // 1. DASHBOARD PRINCIPAL (AO VIVO)
        // ==========================================
        async function carregarDashboard() {
            // AJUSTE: Garantir data local no formato YYYY-MM-DD
            const now = new Date();
            const hoje = now.getFullYear() + '-' + 
                        String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                        String(now.getDate()).padStart(2, '0');

            const divSalas = document.getElementById('painel-salas');
            divSalas.innerHTML = '<div class="col-span-4 text-center text-gray-500"><i class="fas fa-spinner fa-spin"></i> Carregando dados de hoje...</div>';

            // 1. Buscar Professores Escalados APENAS Hoje
            const { data: escalas } = await _supabase
                .from('escala2')
                .select('*')
                .eq('data_culto', hoje); // Filtro estrito pela data de hoje

            // 2. Buscar Crianças Presentes (Hora Saída IS NULL)
            const { data: presencas } = await _supabase
                .from('presenca')
                .select('sala_atual, hora_saida, criancas(nome, nome_responsavel)')
                .eq('data_culto', hoje)
                .is('hora_saida', null); 

            // Estrutura Base das Salas
            const estruturaSalas = {
                "0-2": { titulo: "0 a 2 Anos", profs: "Não escalado", kids: [] },
                "3-5": { titulo: "3 a 5 Anos", profs: "Não escalado", kids: [] },
                "6-8": { titulo: "6 a 8 Anos", profs: "Não escalado", kids: [] },
                "9-12": { titulo: "9 a 12 Anos", profs: "Não escalado", kids: [] }
            };

            // Preencher Professores (Se houver escala para hoje)
            if(escalas && escalas.length > 0) {
                escalas.forEach(esc => {
                    if(estruturaSalas[esc.sala]) {
                        estruturaSalas[esc.sala].profs = esc.professores_nomes;
                    }
                });
            }

            // Preencher Crianças
            let totalCount = 0;
            if(presencas) {
                presencas.forEach(p => {
                    if(p.criancas && estruturaSalas[p.sala_atual]) {
                        estruturaSalas[p.sala_atual].kids.push(p.criancas.nome);
                        totalCount++;
                    }
                });
            }
            document.getElementById('dash-total-kids').innerText = totalCount;

            // Renderizar HTML
            divSalas.innerHTML = '';
            for (const [key, sala] of Object.entries(estruturaSalas)) {
                let listaKidsHTML = '';
                if(sala.kids.length === 0) {
                    listaKidsHTML = '<p class="text-gray-400 text-xs italic p-2">Sala vazia</p>';
                } else {
                    listaKidsHTML = '<ul class="kid-list text-sm text-gray-700 divide-y">';
                    sala.kids.forEach(nome => {
                        listaKidsHTML += `<li class="py-1 px-2 flex items-center"><i class="fas fa-check-circle text-green-500 mr-2 text-xs"></i> ${nome}</li>`;
                    });
                    listaKidsHTML += '</ul>';
                }

                divSalas.innerHTML += `
                    <div class="bg-white rounded-lg shadow border-t-4 ${sala.kids.length > 0 ? 'border-green-500' : 'border-gray-300'} overflow-hidden">
                        <div class="p-3 bg-gray-50 border-b flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-lg text-gray-800">${sala.titulo}</h3>
                                <p class="text-xs text-indigo-600 font-semibold mt-1"><i class="fas fa-chalkboard-teacher"></i> ${sala.profs}</p>
                            </div>
                            <span class="bg-gray-200 text-gray-700 text-xs px-2 py-1 rounded-full font-bold">${sala.kids.length}</span>
                        </div>
                        <div class="p-2 bg-white">
                            <p class="text-xs font-bold text-gray-400 uppercase mb-1">Alunos Presentes:</p>
                            ${listaKidsHTML}
                        </div>
                    </div>
                `;
            }
        }

        // ==========================================
        // 2. HISTÓRICO
        // ==========================================
        async function buscarHistorico() {
            const dataBusca = document.getElementById('hist-data').value;
            if(!dataBusca) return alert("Selecione uma data.");

            const divResult = document.getElementById('hist-resultado');
            divResult.innerHTML = '<p class="text-center text-gray-500">Buscando dados...</p>';

            // Buscar escalas do dia
            const { data: escalas } = await _supabase.from('escala2').select('*').eq('data_culto', dataBusca);

            // Buscar TODAS as presenças (independente de saida)
            const { data: historico } = await _supabase
                .from('presenca')
                .select('sala_atual, hora_entrada, hora_saida, criancas(nome)')
                .eq('data_culto', dataBusca)
                .order('sala_atual');

            if((!escalas || escalas.length === 0) && (!historico || historico.length === 0)){
                divResult.innerHTML = `<div class="bg-yellow-100 p-4 text-center rounded text-yellow-700">Nenhum registro encontrado para ${dataBusca.split('-').reverse().join('/')}.</div>`;
                return;
            }

            // Agrupar dados
            const dadosSalas = { "0-2": [], "3-5": [], "6-8": [], "9-12": [] };
            const profsSalas = { "0-2": "S/ Prof", "3-5": "S/ Prof", "6-8": "S/ Prof", "9-12": "S/ Prof" };

            if(escalas) escalas.forEach(e => { if(profsSalas[e.sala]) profsSalas[e.sala] = e.professores_nomes; });
            
            if(historico) {
                historico.forEach(h => {
                    if(dadosSalas[h.sala_atual]) dadosSalas[h.sala_atual].push(h);
                });
            }

            // Montar Relatório
            let html = '';
            for(const [salaCode, lista] of Object.entries(dadosSalas)) {
                html += `
                    <div class="bg-white rounded shadow p-4 border-l-4 border-indigo-500">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-lg">Sala ${salaCode} anos</h3>
                            <span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-1 rounded">Total: ${lista.length}</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-3"><strong>Professor(es):</strong> ${profsSalas[salaCode]}</p>
                        
                        ${lista.length === 0 ? '<p class="text-sm text-gray-400">Sem alunos.</p>' : 
                          `<div class="overflow-x-auto"><table class="w-full text-xs text-left">
                                <thead class="bg-gray-100"><tr><th class="p-2">Criança</th><th class="p-2">Entrada</th><th class="p-2">Saída</th></tr></thead>
                                <tbody>` + 
                                lista.map(item => `
                                    <tr class="border-b">
                                        <td class="p-2 font-medium">${item.criancas ? item.criancas.nome : 'Desc.'}</td>
                                        <td class="p-2">${new Date(item.hora_entrada).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td>
                                        <td class="p-2">${item.hora_saida ? new Date(item.hora_saida).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '<span class="text-red-500">Sem saída</span>'}</td>
                                    </tr>
                                `).join('') + 
                          `</tbody></table></div>`
                        }
                    </div>
                `;
            }
            divResult.innerHTML = html;
        }

        // ==========================================
        // 3. CHECK-IN / CHECK-OUT
        // ==========================================
        async function processarCheckin(qrcode) {
            const divRes = document.getElementById('qr-result');
            const elTitle = document.getElementById('qr-msg-title');
            const elBody = document.getElementById('qr-msg-body');
            const elDetails = document.getElementById('qr-msg-details');
            
            divRes.classList.remove('hidden', 'bg-red-50', 'bg-green-50', 'bg-blue-50', 'border-red-500', 'border-green-500', 'border-blue-500');
            divRes.classList.add('block');

            // Buscar criança
            const { data: kid } = await _supabase.from('criancas').select('*').eq('qrcode_code', qrcode).single();

            if(!kid) {
                divRes.classList.add('bg-red-50', 'border-red-500');
                elTitle.innerText = "NÃO ENCONTRADO";
                elTitle.className = "text-xl font-bold text-red-600";
                elBody.innerText = `QR Code ${qrcode} inválido.`;
                elDetails.innerHTML = "";
                return;
            }

            // Definir Sala
            let salaFinal = kid.sala_fixa;
            let idade = calcularIdade(kid.data_nascimento);
            
            if(!salaFinal) {
                // Cálculo automático se não tiver fixa
                if (idade <= 2) salaFinal = "0-2";
                else if (idade <= 5) salaFinal = "3-5";
                else if (idade <= 8) salaFinal = "6-8";
                else if (idade <= 12) salaFinal = "9-12";
                else salaFinal = "Visitante";
            }

            // Ajuste para garantir data local
            const now = new Date();
            const hoje = now.getFullYear() + '-' + 
                         String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                         String(now.getDate()).padStart(2, '0');
            
            // Verificar status atual
            const { data: presenca } = await _supabase
                .from('presenca')
                .select('*')
                .eq('crianca_id', kid.id)
                .eq('data_culto', hoje)
                .is('hora_saida', null)
                .maybeSingle();

            if (presenca) {
                // SAÍDA
                await _supabase.from('presenca').update({ hora_saida: new Date() }).eq('id', presenca.id);
                
                divRes.classList.add('bg-blue-50', 'border-blue-500');
                elTitle.innerText = "SAÍDA REGISTRADA";
                elTitle.className = "text-xl font-bold text-blue-600";
                elBody.innerHTML = `Até logo, <b>${kid.nome}</b>!`;
                elDetails.innerHTML = `Entregue ao responsável: <b>${kid.nome_responsavel || 'Não informado'}</b>`;
                
                // Remover do painel principal (se estiver aberto em outra tela, atualiza no próximo refresh)
            } else {
                // ENTRADA
                const { error } = await _supabase.from('presenca').insert([{
                    crianca_id: kid.id,
                    data_culto: hoje,
                    sala_atual: salaFinal
                }]);

                if(!error) {
                    divRes.classList.add('bg-green-50', 'border-green-500');
                    elTitle.innerText = "ENTRADA CONFIRMADA";
                    elTitle.className = "text-xl font-bold text-green-600";
                    elBody.innerHTML = `Bem-vindo(a), <b>${kid.nome}</b>!`;
                    elDetails.innerHTML = `Sala: <b>${salaFinal}</b><br>Resp: ${kid.nome_responsavel || '-'}`;
                }
            }
            document.getElementById('qr-msg-time').innerText = "Registro: " + new Date().toLocaleTimeString();
        }

        // ==========================================
        // 4. CADASTRO DE CRIANÇAS ATUALIZADO
        // ==========================================
        async function addCrianca() {
            const nome = document.getElementById('kid-nome').value;
            const nasc = document.getElementById('kid-nasc').value;
            const resp = document.getElementById('kid-resp').value;
            const sala = document.getElementById('kid-sala').value;
            const qr = document.getElementById('kid-qr').value;

            if(!nome || !nasc || !qr || !resp) return alert('Preencha Nome, Nascimento, Responsável e QR.');

            const payload = { 
                nome, 
                data_nascimento: nasc, 
                nome_responsavel: resp, 
                qrcode_code: qr 
            };
            if(sala) payload.sala_fixa = sala;

            const { error } = await _supabase.from('criancas').insert([payload]);

            if(error) alert('Erro: ' + error.message);
            else {
                alert('Criança cadastrada com sucesso!');
                document.getElementById('kid-nome').value = '';
                document.getElementById('kid-qr').value = '';
                carregarCriancas();
            }
        }

        async function carregarCriancas() {
            const { data } = await _supabase.from('criancas').select('*').order('id', {ascending: false}).limit(10);
            const div = document.getElementById('lista-criancas');
            div.innerHTML = '';
            if(data) {
                data.forEach(c => {
                    div.innerHTML += `
                        <div class="border-b py-2 flex justify-between items-center text-sm">
                            <div>
                                <span class="font-bold text-gray-700">${c.nome}</span>
                                <div class="text-xs text-gray-500">Resp: ${c.nome_responsavel || '-'}</div>
                            </div>
                            <span class="bg-yellow-100 font-mono px-2 rounded">QR: ${c.qrcode_code}</span>
                        </div>`;
                });
            }
        }

        // ==========================================
        // UTILITÁRIOS E OUTRAS FUNÇÕES
        // ==========================================
        function calcularIdade(dataNasc) {
            const hoje = new Date();
            const nasc = new Date(dataNasc);
            let idade = hoje.getFullYear() - nasc.getFullYear();
            const m = hoje.getMonth() - nasc.getMonth();
            if (m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
            return idade;
        }

        // Scanner Logic
        let html5QrcodeScanner = null;
        function startScanner() {
            if(html5QrcodeScanner) return;
            try {
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess);
            } catch (e) { console.log(e); }
        }
        function stopScanner() {
            if(html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => { html5QrcodeScanner.clear(); html5QrcodeScanner = null; }).catch(err=>{});
            }
        }
        function onScanSuccess(decodedText) {
            if(navigator.vibrate) navigator.vibrate(200);
            processarCheckin(decodedText);
            html5QrcodeScanner.pause();
            setTimeout(() => html5QrcodeScanner.resume(), 3500);
        }
        function processarCheckinManual() {
            const val = document.getElementById('manual-qr').value;
            if(val) processarCheckin(val);
        }

        // Profs Logic
        async function addProfessor() {
            const nome = document.getElementById('prof-nome').value;
            const sala = document.getElementById('prof-sala').value;
            if(!nome) return alert('Nome obrigatório');
            await _supabase.from('professores').insert([{ nome, sala_preferencia: sala }]);
            document.getElementById('prof-nome').value = '';
            carregarProfessores();
        }
        async function carregarProfessores() {
            const { data } = await _supabase.from('professores').select('*').order('nome');
            const lista = document.getElementById('lista-professores');
            lista.innerHTML = '';
            if(data) data.forEach(p => {
                lista.innerHTML += `<tr class="border-b"><td class="p-3 font-medium">${p.nome}</td><td class="p-3 text-sm">${p.sala_preferencia||'-'}</td><td class="p-3"><button onclick="delProf(${p.id})" class="text-red-500"><i class="fas fa-trash"></i></button></td></tr>`;
            });
        }
        async function delProf(id) { if(confirm('Excluir?')) { await _supabase.from('professores').delete().eq('id', id); carregarProfessores(); } }

        // Escala Logic
        async function carregarProfessoresCheckbox() {
            const { data } = await _supabase.from('professores').select('*').order('nome');
            const container = document.getElementById('escala-prof-select');
            container.innerHTML = '';
            if(data) data.forEach(p => {
                container.innerHTML += `<label class="flex items-center space-x-2 cursor-pointer bg-white p-1 rounded border"><input type="checkbox" value="${p.nome}" class="prof-checkbox"><span class="text-xs font-bold">${p.nome}</span></label>`;
            });
        }
        async function salvarEscala() {
            const dataCulto = document.getElementById('escala-data').value;
            const sala = document.getElementById('escala-sala').value;
            const checkboxes = document.querySelectorAll('.prof-checkbox:checked');
            const nomes = Array.from(checkboxes).map(cb => cb.value).join(', ');
            if(!dataCulto || checkboxes.length === 0) return alert('Dados incompletos');
            await _supabase.from('escala2').insert([{ data_culto: dataCulto, sala: sala, professores_nomes: nomes }]);
            alert('Escalado!'); carregarEscalas();
        }
        async function carregarEscalas() {
            const { data } = await _supabase.from('escala2').select('*').order('data_culto', { ascending: false }).limit(6);
            const lista = document.getElementById('lista-escalas');
            lista.innerHTML = '';
            if(data) data.forEach(e => {
                lista.innerHTML += `<div class="bg-white p-3 rounded border shadow-sm text-sm"><div class="flex justify-between font-bold text-indigo-600"><span>${new Date(e.data_culto).toLocaleDateString('pt-BR')}</span><span>Sala ${e.sala}</span></div><p class="mt-1 text-gray-700">${e.professores_nomes}</p></div>`;
            });
        }

        // Iniciar
        showTab('dashboard');
    </script>
</body>
</html>
